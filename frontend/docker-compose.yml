version: "3.8"

networks:
  spice_network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:

services:
  # 1. Relational Database Cluster
  db:
    image: postgres:15-alpine
    container_name: spice_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spicedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spice_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Semantic Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: spice_chroma
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    networks:
      - spice_network
    ports:
      - "8000:8000"

  # 3. Core FastAPI Logic Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spice_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/spicedb
      - GEMINI_API_KEY=your_actual_gemini_api_key_here
      - SECRET_KEY=your_production_secret_key_here
    networks:
      - spice_network
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 4. Next.js Client User Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spice_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - spice_network
    ports:
      - "3000:3000"
    depends_on:
      - backend
