version: "3.8"

networks:
  spice_network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:

services:
  # 1. Relational Database Cluster
  db:
    image: postgres:15-alpine
    container_name: spice_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spicedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spice_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Core FastAPI Logic Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spice_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/spicedb
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-before-deploying}
    networks:
      - spice_network
    volumes:
      - chroma_data:/code/data/chromadb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Client User Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: spice_frontend
    networks:
      - spice_network
    ports:
      - "3000:3000"
    depends_on:
      - backend
